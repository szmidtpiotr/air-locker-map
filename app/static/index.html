<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Powietrze z paczkomatów</title>
<link rel="stylesheet" href="/static/vendor/maplibre-gl.css">
<link rel="stylesheet" href="/static/style.css">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/static/icon-192.png">
<meta name="theme-color" content="#1d2330">
</head>
<body>
<div id="map"></div>

<aside id="panel">
  <header>
    <h1 id="title">Powietrze z paczkomatów</h1>
    <button id="panel-toggle" class="icon" title="Zwiń panel" aria-label="Zwiń panel">‹</button>
  </header>

  <div class="panel-body">
    <div id="summary" class="summary"></div>

    <form id="search" autocomplete="off">
      <input id="q" type="search" placeholder="Adres albo kod paczkomatu (np. WAW84A)" aria-label="Szukaj">
      <button type="submit">Szukaj</button>
    </form>
    <div id="search-results"></div>

    <section>
      <h2>Wielkość</h2>
      <div class="chips" id="metrics"></div>
    </section>

    <section>
      <h2>Widok</h2>
      <div class="chips" id="views">
        <button data-view="points">Kropki</button>
        <button data-view="hex">Sześciokąty</button>
        <button data-view="heat">Plama</button>
      </div>
      <p class="hint" id="view-hint"></p>
    </section>

    <section id="time-box">
      <h2>Czas <span id="time-label" class="time-label">na żywo</span></h2>
      <div class="time-row period-row">
        <label for="time-period" class="muted">Okres</label>
        <select id="time-period">
          <option value="6">6 h</option><option value="12">12 h</option><option value="24" selected>24 h</option>
          <option value="72">3 dni</option><option value="168">7 dni</option><option value="custom">własny…</option>
        </select>
      </div>
      <div class="time-row custom-row" id="time-custom" hidden>
        <input type="datetime-local" id="time-from" aria-label="Od"> –
        <input type="datetime-local" id="time-to" aria-label="Do">
        <button id="time-apply" class="chip-btn">Pokaż</button>
      </div>
      <div class="time-row">
        <button id="time-play" class="icon-btn" title="Odtwórz ostatnie 24 h" aria-label="Odtwórz">▶</button>
        <input type="range" id="time-slider" min="0" max="0" value="0" aria-label="Czas odczytu">
        <select id="time-speed" title="Prędkość animacji" aria-label="Prędkość animacji">
          <option value="2400">0,5×</option><option value="1200" selected>1×</option>
          <option value="600">2×</option><option value="300">4×</option>
        </select>
        <button id="time-live" class="chip-btn" title="Wróć do bieżących odczytów">Teraz</button>
      </div>
      <p class="hint" id="time-hint"></p>
    </section>

    <section class="toggles">
      <label><input type="checkbox" id="show-suspect"> Pokaż podejrzane czujniki</label>
      <label><input type="checkbox" id="show-gios"> Stacje GIOŚ (oficjalne)</label>
      <label><input type="checkbox" id="show-wind"> Wiatr (Open-Meteo)</label>
      <label><input type="checkbox" id="show-isobars"> Izobary (co 2 hPa)</label>
    </section>

    <section>
      <h2>Legenda</h2>
      <div id="legend"></div>
    </section>

    <section id="nearest-box" hidden>
      <h2>Najbliższe czujniki <button class="linkbtn alert-here" id="alert-origin">🔔 alert smogowy tutaj</button></h2>
      <ol id="nearest"></ol>
    </section>
    <section id="my-alerts-box" hidden>
      <h2>Moje alerty w tej przeglądarce</h2>
      <ul id="my-alerts"></ul>
    </section>
  </div>

  <footer>
    <span id="status">Ładowanie…</span>
    <span class="links"><button id="stats-open" class="linkbtn">Statystyki</button> · <a href="/api">API</a> · <a href="https://github.com/szmidtpiotr/air-locker-map" target="_blank" rel="noopener noreferrer">GitHub</a> · <a href="/admin" class="admin-link">Admin</a></span>
  </footer>
</aside>

<div id="stats-modal" class="modal" hidden>
  <div class="modal-box" role="dialog" aria-labelledby="stats-title">
    <header><h2 id="stats-title">Statystyki</h2><button class="icon" id="stats-close" aria-label="Zamknij">×</button></header>
    <div id="stats-body">Ładowanie…</div>
  </div>
</div>

<div id="alert-modal" class="modal" hidden>
  <div class="modal-box narrow-box" role="dialog" aria-labelledby="alert-title">
    <header><h2 id="alert-title">Alert smogowy</h2><button class="icon" id="alert-close" aria-label="Zamknij">×</button></header>
    <div id="alert-body"></div>
  </div>
</div>

<script src="/static/vendor/maplibre-gl.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
